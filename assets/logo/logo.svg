<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 110" width="100%" height="100%">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#041f34" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Logo Mark (Interlocking CC with Diamond Sparkle) -->
  <g transform="translate(10, 5)">
    <!-- Outer decorative circle ring subtle -->
    <circle cx="50" cy="50" r="46" fill="none" stroke="#e0f2fe" stroke-width="2" opacity="0.6"/>
    <circle cx="50" cy="50" r="41" fill="#f0f9ff" opacity="0.8"/>
    
    <!-- First 'C' -->
    <path d="M 58 20 C 35 20 22 33 22 50 C 22 67 35 80 58 80 C 66 80 72 77 76 73 L 71 65 C 68 68 64 70 58 70 C 42 70 33 60 33 50 C 33 40 42 30 58 30 C 64 30 68 32 71 35 L 76 27 C 72 23 66 20 58 20 Z" fill="url(#primaryGrad)" />
    
    <!-- Second interlocking 'C' offset slightly -->
    <path d="M 68 28 C 55 28 47 36 45 44 C 47 43 51 42 55 42 C 65 42 71 47 71 55 C 71 63 65 68 56 68 C 53 68 50 67 47 65 C 50 71 58 76 68 76 C 82 76 90 65 90 52 C 90 39 82 28 68 28 Z" fill="#0284c7" opacity="0.9" />

    <!-- Center Diamond Sparkle -->
    <g transform="translate(50, 50)">
      <!-- 4-point star -->
      <path d="M 0 -15 Q 0 0 15 0 Q 0 0 0 15 Q 0 0 -15 0 Q 0 0 0 -15 Z" fill="url(#sparkleGrad)" filter="url(#glow)"/>
      <circle cx="0" cy="0" r="3.5" fill="#ffffff" />
      <!-- Tiny secondary sparkles -->
      <path d="M 18 -18 Q 18 -12 24 -12 Q 18 -12 18 -6 Q 18 -12 12 -12 Q 18 -12 18 -18 Z" fill="#38bdf8" opacity="0.9"/>
    </g>
  </g>

  <!-- Typography -->
  <g transform="translate(120, 0)">
    <!-- Brand Name -->
    <text x="0" y="46" font-family="'Cinzel', 'Trajan Pro', 'Playfair Display', 'Cinzel Decorative', 'Georgia', serif" font-size="29" font-weight="700" letter-spacing="4" fill="#041f34">CRYSTAL CLEAR</text>
    
    <!-- Service Line with Decorative Accents -->
    <line x1="2" y1="58" x2="35" y2="58" stroke="#0284c7" stroke-width="1.5" stroke-linecap="round" />
    <text x="44" y="62" font-family="'Montserrat', 'Inter', 'Segoe UI', sans-serif" font-size="11" font-weight="600" letter-spacing="3.5" fill="#0284c7">COMMERCIAL SERVICES LIMITED</text>
    <line x1="335" y1="58" x2="368" y2="58" stroke="#0284c7" stroke-width="1.5" stroke-linecap="round" />
    
    <!-- Tagline -->
    <text x="2" y="85" font-family="'Montserrat', 'Inter', 'Segoe UI', sans-serif" font-size="10.5" font-weight="500" letter-spacing="2.8" fill="#64748b">CLEAN SPACES. STRONGER BUSINESSES.</text>
  </g>
</svg>
