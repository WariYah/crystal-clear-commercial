<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 110" width="100%" height="100%">
  <defs>
    <linearGradient id="whiteSparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="glowDark" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Logo Mark for Dark Background -->
  <g transform="translate(10, 5)">
    <circle cx="50" cy="50" r="46" fill="none" stroke="rgba(56, 189, 248, 0.3)" stroke-width="2"/>
    <circle cx="50" cy="50" r="41" fill="rgba(14, 165, 233, 0.12)"/>
    
    <!-- First 'C' in bright white -->
    <path d="M 58 20 C 35 20 22 33 22 50 C 22 67 35 80 58 80 C 66 80 72 77 76 73 L 71 65 C 68 68 64 70 58 70 C 42 70 33 60 33 50 C 33 40 42 30 58 30 C 64 30 68 32 71 35 L 76 27 C 72 23 66 20 58 20 Z" fill="#ffffff" />
    
    <!-- Second 'C' in cyan -->
    <path d="M 68 28 C 55 28 47 36 45 44 C 47 43 51 42 55 42 C 65 42 71 47 71 55 C 71 63 65 68 56 68 C 53 68 50 67 47 65 C 50 71 58 76 68 76 C 82 76 90 65 90 52 C 90 39 82 28 68 28 Z" fill="#38bdf8" />

    <!-- Center Diamond Sparkle -->
    <g transform="translate(50, 50)">
      <path d="M 0 -15 Q 0 0 15 0 Q 0 0 0 15 Q 0 0 -15 0 Q 0 0 0 -15 Z" fill="url(#whiteSparkleGrad)" filter="url(#glowDark)"/>
      <circle cx="0" cy="0" r="3.5" fill="#ffffff" />
      <path d="M 18 -18 Q 18 -12 24 -12 Q 18 -12 18 -6 Q 18 -12 12 -12 Q 18 -12 18 -18 Z" fill="#38bdf8" />
    </g>
  </g>

  <!-- Typography for Dark Background -->
  <g transform="translate(120, 0)">
    <text x="0" y="46" font-family="'Cinzel', 'Trajan Pro', 'Playfair Display', 'Cinzel Decorative', 'Georgia', serif" font-size="29" font-weight="700" letter-spacing="4" fill="#ffffff">CRYSTAL CLEAR</text>
    
    <line x1="2" y1="58" x2="35" y2="58" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" />
    <text x="44" y="62" font-family="'Montserrat', 'Inter', 'Segoe UI', sans-serif" font-size="11" font-weight="600" letter-spacing="3.5" fill="#38bdf8">COMMERCIAL SERVICES LIMITED</text>
    <line x1="335" y1="58" x2="368" y2="58" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" />
    
    <text x="2" y="85" font-family="'Montserrat', 'Inter', 'Segoe UI', sans-serif" font-size="10.5" font-weight="500" letter-spacing="2.8" fill="#94a3b8">CLEAN SPACES. STRONGER BUSINESSES.</text>
  </g>
</svg>
